<div class="sidebar">
  <!-- My profile header -->
  <header class="sidebar__header">
    <div class="sidebar__me" *ngIf="auth.currentUser$ | async as me">
      <app-avatar [src]="me.avatar" [name]="me.userName" [size]="44" />
      <div class="sidebar__me-text">
        <strong>{{ me.userName }}</strong>
        <small>{{ me.phone }}</small>
      </div>
    </div>
    <div class="sidebar__actions">
      <button class="icon-btn" type="button" (click)="theme.toggle()" title="Toggle theme" aria-label="Toggle theme">
        <svg *ngIf="(theme.theme$ | async) === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg *ngIf="(theme.theme$ | async) === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      </button>
      <button class="icon-btn" type="button" (click)="logout()" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Search -->
  <div class="sidebar__search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
    <input type="text" placeholder="Search people…" [ngModel]="search$ | async"
      (ngModelChange)="onSearch($event)" aria-label="Search people" />
  </div>

  <!-- Conversation list -->
  <nav class="sidebar__list">
    <!-- Skeletons -->
    <ng-container *ngIf="(store.loadingUsers$ | async) && (store.users$ | async)?.length === 0">
      <div class="chat-item chat-item--skeleton" *ngFor="let s of skeletons">
        <span class="skeleton chat-item__skeleton-avatar"></span>
        <span class="chat-item__skeleton-lines">
          <span class="skeleton" style="width: 55%; height: 13px;"></span>
          <span class="skeleton" style="width: 80%; height: 11px;"></span>
        </span>
      </div>
    </ng-container>

    <ng-container *ngIf="!(store.loadingUsers$ | async) || (store.users$ | async)?.length">
      <!-- Empty: nobody registered yet -->
      <div class="sidebar__empty" *ngIf="(store.users$ | async)?.length === 0">
        <span class="sidebar__empty-icon">👥</span>
        <p><strong>No one here yet</strong></p>
        <p>Ask a friend to create an account and they will show up here instantly.</p>
      </div>

      <!-- Empty: no search results -->
      <div class="sidebar__empty"
        *ngIf="(store.users$ | async)?.length && (filteredUsers$ | async)?.length === 0">
        <span class="sidebar__empty-icon">🔍</span>
        <p><strong>No matches</strong></p>
        <p>Nobody matches “{{ search$ | async }}”.</p>
      </div>

      <!-- Items -->
      <button type="button" class="chat-item"
        *ngFor="let user of filteredUsers$ | async; trackBy: trackById"
        [class.chat-item--active]="(store.activeChat$ | async)?.id === user.id" (click)="open(user)">
        <app-avatar [src]="user.avatar" [name]="user.userName" [size]="48" [online]="user.online"
          [showPresence]="true" />
        <span class="chat-item__body">
          <span class="chat-item__top">
            <span class="chat-item__name">{{ user.userName }}</span>
            <span class="chat-item__time" *ngIf="user.lastMessage">
              {{ user.lastMessage.createdAt | timeAgo }}
            </span>
          </span>
          <span class="chat-item__bottom">
            <span class="chat-item__preview chat-item__preview--typing"
              *ngIf="isTyping(user, store.typing$ | async); else preview">
              typing<span class="typing-dots"><span></span><span></span><span></span></span>
            </span>
            <ng-template #preview>
              <span class="chat-item__preview" [class.chat-item__preview--hi]="!user.lastMessage">
                {{ previewFor(user) }}
              </span>
            </ng-template>
            <span class="chat-item__badge" *ngIf="user.unreadCount > 0">
              {{ user.unreadCount > 99 ? '99+' : user.unreadCount }}
            </span>
          </span>
        </span>
      </button>
    </ng-container>
  </nav>
</div>
