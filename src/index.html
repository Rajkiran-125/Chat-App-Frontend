<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>ChatApp — Messages</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Realtime chat application">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" type="image/png" href="assets/favicon/orenge.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap"
    rel="stylesheet">

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var theme = localStorage.getItem('chatapp.theme') ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { }
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
